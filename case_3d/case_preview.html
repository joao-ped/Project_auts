<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voz Autista — Case v3.0 (preview)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    overflow:hidden;user-select:none;
    background:radial-gradient(ellipse at 50% 38%, #ffffff 0%, #eef2f7 92%);
    font-family:'Segoe UI',Arial,sans-serif;
  }
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas:active{cursor:grabbing}
  #hint{
    position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
    color:#64748b;font-size:11px;letter-spacing:.02em;
    background:rgba(255,255,255,.7);padding:5px 14px;border-radius:20px;
    border:1px solid #e2e8f0;pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Arraste para girar &middot; scroll para zoom</div>

<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// Camera — estatica, voltada para a PARTE DE CIMA (LCD + botoes)
var rotX = -0.92, rotY = 0.52, zoom = 2.7, panX = 0, panY = -2;
var dragging = false, lastMX = 0, lastMY = 0, idle = 0;
var caseColor = [37, 99, 235];   // azul de contraste (sobre fundo branco)
var cutaway = false;

// ============ MATH 3D ============
function rotatePoint(x, y, z) {
  var cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  var x1 = x * cosY - z * sinY, z1 = x * sinY + z * cosY;
  var cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  var y1 = y * cosX - z1 * sinX, z2 = y * sinX + z1 * cosX;
  return [x1, y1, z2];
}
function project(x, y, z) {
  var p = rotatePoint(x, y, z);
  var d = 600, scale = d / (d + p[2]) * zoom;
  return [canvas.width/2 + (p[0]+panX)*scale, canvas.height/2 + (p[1]+panY)*scale, p[2]];
}
function faceNormal(v){
  var a=v[0], b=v[1], c=v[2];
  return [
    (b[1]-a[1])*(c[2]-a[2])-(b[2]-a[2])*(c[1]-a[1]),
    (b[2]-a[2])*(c[0]-a[0])-(b[0]-a[0])*(c[2]-a[2]),
    (b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0])
  ];
}
function avgZ(pts){var s=0;for(var i=0;i<pts.length;i++)s+=pts[i][2];return s/pts.length;}

// ============ GEOMETRIA (igual ao case_voz_autista_v3.scad — SO O CASE) ============
var faces = [];
var W=150, D=100, WALL=2.5;
var H_BASE=26.5;
var FL=H_BASE-WALL;
var LID_F=13.5;
var TAN12=Math.tan(12*Math.PI/180);
var HINGE=14;
var LID_R=LID_F+(50-HINGE)*TAN12;
function lx(x){return x-75;}
function lz(y){return y-50;}

function addFace(verts, color, alpha, group, type){
  faces.push({verts:verts, color:color, alpha:alpha, group:group, type:type||'case'});
}
function addBox(cx, cy, cz, w, h, d, color, alpha, group, type){
  var x0=cx-w/2,x1=cx+w/2, y0=cy-h/2,y1=cy+h/2, z0=cz-d/2,z1=cz+d/2;
  var v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],
         [x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
  var ff=[[v[0],v[1],v[2],v[3]],[v[5],v[4],v[7],v[6]],
          [v[4],v[0],v[3],v[7]],[v[1],v[5],v[6],v[2]],
          [v[4],v[5],v[1],v[0]],[v[3],v[2],v[6],v[7]]];
  for(var i=0;i<6;i++) addFace(ff[i],color,alpha,group,type);
}
function addCylinder(cx, cy, cz, r, h, segs, color, alpha, group, type){
  var top=[], bot=[];
  for(var i=0;i<segs;i++){
    var a=(i/segs)*Math.PI*2;
    top.push([cx+Math.cos(a)*r, cy-h/2, cz+Math.sin(a)*r]);
    bot.push([cx+Math.cos(a)*r, cy+h/2, cz+Math.sin(a)*r]);
  }
  for(var i=0;i<segs;i++){
    var j=(i+1)%segs;
    addFace([bot[i],bot[j],top[j],top[i]], color, alpha, group, type);
  }
  addFace(top.slice(), color, alpha, group, type);
  addFace(bot.slice().reverse(), color, alpha, group, type);
}

function buildModel(){
  faces = [];
  var cc = caseColor;
  var dark=[50,50,55], darker=[35,35,40], copper=[200,140,60];
  var screen=[30,80,30];
  var tp4Purple=[124,58,237], switchGreen=[16,185,129];
  var ccDark=[(cc[0]*0.7)|0,(cc[1]*0.7)|0,(cc[2]*0.7)|0];
  var ccWall=[(cc[0]*0.55)|0,(cc[1]*0.55)|0,(cc[2]*0.55)|0];

  // ===== BASE (casca) =====
  addBox(0, H_BASE-WALL/2+1.25, 0, W, WALL, D, cc, 1, 'base', 'case');           // fundo
  addBox(0, H_BASE/2, -D/2+WALL/2, W, H_BASE, WALL, cc, 1, 'base', 'case');      // parede frente
  addBox(0, H_BASE/2, D/2-WALL/2, W, H_BASE, WALL, cc, 1, 'base', 'case');       // parede tras
  addBox(-W/2+WALL/2, H_BASE/2, 0, WALL, H_BASE, D-2*WALL, cc, 1, 'base', 'case'); // esquerda
  addBox(W/2-WALL/2, H_BASE/2, 0, WALL, H_BASE, D-2*WALL, cc, 1, 'base', 'case');  // direita

  // Aberturas (parede ESQUERDA): USB-B, jack, microUSB carga
  addBox(-W/2+WALL/2, H_BASE-15, lz(45.5), WALL+1, 13, 14, dark, 1, 'base', 'detail');
  addBox(-W/2+WALL/2, H_BASE-13.5, lz(15.5), WALL+1, 12, 13, dark, 1, 'base', 'detail');
  addBox(-W/2+WALL/2, H_BASE-9, lz(71), WALL+1, 5, 10, tp4Purple, 1, 'base', 'detail');

  // Abertura (parede DIREITA): potenciometro + knob externo
  addCylinder(W/2-WALL/2, H_BASE-20, lz(15.5), 3.75, WALL+1, 12, dark, 1, 'base', 'detail');
  addCylinder(W/2+5, H_BASE-20, lz(15.5), 10, 9, 16, ccDark, 1, 'base', 'detail');

  // Aberturas (parede TRASEIRA): slot SD + chave recuada
  addBox(lx(108), H_BASE-9.25, D/2-WALL/2, 14, 5.5, WALL+1, dark, 1, 'base', 'detail');
  addBox(lx(29.25), H_BASE-9.3, D/2-WALL/2, 13.5, 5.6, WALL+1, switchGreen, 1, 'base', 'detail');
  addBox(lx(29.25), H_BASE-9.3, D/2+1.25, 21, 12, 2.5, ccDark, 0.95, 'base', 'detail');
  addBox(lx(29.25), H_BASE-9.3, D/2+1.3, 15, 7, 2.7, darker, 1, 'base', 'detail');

  // Pilares dos parafusos M3
  addCylinder(lx(139.5), H_BASE/2, lz(10.5), 4, H_BASE-WALL, 12, cc, 0.9, 'base', 'detail');
  addCylinder(lx(70),    H_BASE/2, lz(93),   4, H_BASE-WALL, 12, cc, 0.9, 'base', 'detail');

  // Pilares do Arduino (furos canonicos)
  var ah=[[15.24,2.54],[15.24,50.80],[66.04,7.62],[66.04,35.56]];
  for(var i=0;i<ah.length;i++)
    addCylinder(lx(6.5+ah[i][0]), FL-1.5, lz(5.5+ah[i][1]), 3, 3, 10, copper, 0.9, 'base', 'detail');

  // Poco da bateria (paredes)
  addBox(lx(120.75), FL-10.5, lz(58.5), 2.5, 21, 73, ccWall, 0.9, 'base', 'detail');
  addBox(lx(144.25), FL-10.5, lz(58.5), 2.5, 21, 73, ccWall, 0.9, 'base', 'detail');
  addBox(lx(132.5),  FL-10.5, lz(23.25), 21, 21, 2.5, ccWall, 0.9, 'base', 'detail');
  addBox(lx(132.5),  FL-10.5, lz(93.75), 21, 21, 2.5, ccWall, 0.9, 'base', 'detail');
  addBox(lx(132.5), H_BASE+0.4, lz(58), 23, 0.8, 66, ccDark, 0.9, 'base', 'detail'); // tampa bateria (fundo)

  // Postes do alto-falante + grade no FUNDO
  for(var a=0;a<3;a++){
    var ang=(90+a*120)*Math.PI/180;
    var px=lx(97.5)+Math.cos(ang)*23.3, pz=lz(40.5)+Math.sin(ang)*23.3;
    addCylinder(px, FL-3, pz, 3, 6, 10, ccDark, 0.95, 'base', 'detail');
  }
  for(var ix=-3;ix<=3;ix++) for(var iz=-3;iz<=3;iz++){
    var gx=ix*5.5, gz=iz*5.5;
    if(Math.sqrt(gx*gx+gz*gz)<17)
      addCylinder(lx(97.5)+gx, H_BASE+0.2, lz(40.5)+gz, 1.25, 1, 8, darker, 0.95, 'base', 'detail');
  }

  // Pes de borracha
  var fp=[[lx(14),lz(14)],[lx(136),lz(14)],[lx(14),lz(86)],[lx(136),lz(86)]];
  for(var i=0;i<fp.length;i++)
    addCylinder(fp[i][0], H_BASE+0.3, fp[i][1], 5, 1.2, 14, [40,40,40], 1, 'base', 'detail');

  // Ventilacao sob o Arduino
  for(var vx=0;vx<6;vx++) for(var vy=0;vy<4;vy++)
    addCylinder(lx(20.5+vx*7), H_BASE+0.2, lz(17.5+vy*7), 1.25, 0.8, 8, darker, 0.9, 'base', 'detail');

  // ===== TAMPA (CUNHA) =====
  var zF=-D/2, zR=D/2;
  var secs = [ [zF, 0], [zR, 0], [zR, -LID_R], [HINGE, -LID_F], [zF, -LID_F] ];
  var xL=-W/2, xR=W/2;
  var sl=[], sr=[];
  for(var i=0;i<secs.length;i++){ sl.push([xL,secs[i][1],secs[i][0]]); sr.push([xR,secs[i][1],secs[i][0]]); }
  addFace(sl, cc, 1, 'lid', 'case');
  addFace(sr.slice().reverse(), cc, 1, 'lid', 'case');
  for(var i=0;i<secs.length;i++){
    var j=(i+1)%secs.length;
    addFace([[xL,secs[i][1],secs[i][0]],[xR,secs[i][1],secs[i][0]],
             [xR,secs[j][1],secs[j][0]],[xL,secs[j][1],secs[j][0]]], cc, 1, 'lid', 'case');
  }

  // Janela + tela do LCD na RAMPA (12 graus)
  function slopePt(x, s, lift){
    var zz=HINGE+s*Math.cos(12*Math.PI/180);
    var yy=-LID_F-s*Math.sin(12*Math.PI/180)-(lift||0);
    return [x, yy, zz];
  }
  addFace([slopePt(-40,1,0.25),slopePt(40,1,0.25),slopePt(40,35,0.25),slopePt(-40,35,0.25)], darker, 1, 'lid', 'detail');
  addFace([slopePt(-36.5,5,0.5),slopePt(36.5,5,0.5),slopePt(36.5,31,0.5),slopePt(-36.5,31,0.5)], screen, 1, 'lid', 'detail');

  // Botoes 2+2+1 (CAT- amarelo, CAT+ vermelho, PAL- azul, PAL+ verde, FALAR preto)
  var btns=[
    [63.5,54.5,6,[249,168,37]],
    [91.5,54.5,6,[229,57,53]],
    [63.5,35,  6,[21,101,192]],
    [91.5,35,  6,[67,160,71]],
    [77.5,17.5,9,[40,40,44]]
  ];
  for(var i=0;i<btns.length;i++){
    var b=btns[i], bx=lx(b[0]), bz=lz(b[1]);
    var ringR = (i===4)?12:9.5;
    addCylinder(bx, -LID_F-0.6, bz, ringR, 1.2, 20, ccDark, 0.95, 'lid', 'detail');
    addCylinder(bx, -LID_F-0.3, bz, 7, 1, 16, darker, 1, 'lid', 'detail');
    addCylinder(bx, -LID_F-2.6, bz, b[2], 3.5, 16, b[3], 1, 'lid', 'detail');
  }

  // Orelhas do cordao (traseira)
  addBox(lx(14),  -LID_R+8, D/2+4, 14, 5, 8, cc, 1, 'lid', 'detail');
  addBox(lx(136), -LID_R+8, D/2+4, 14, 5, 8, cc, 1, 'lid', 'detail');
  addCylinder(lx(14),  -LID_R+8, D/2+4, 2.25, 5.4, 10, darker, 1, 'lid', 'detail');
  addCylinder(lx(136), -LID_R+8, D/2+4, 2.25, 5.4, 10, darker, 1, 'lid', 'detail');
}

// ============ RENDER ============
function groundShadow(){
  // sombra de contato a partir dos 4 cantos do fundo
  var cs=[project(-W/2,H_BASE+1,-D/2),project(W/2,H_BASE+1,-D/2),
          project(W/2,H_BASE+1,D/2),project(-W/2,H_BASE+1,D/2)];
  var cx=0,cy=0,maxr=0;
  for(var i=0;i<4;i++){cx+=cs[i][0];cy+=cs[i][1];}
  cx/=4;cy/=4;
  for(var i=0;i<4;i++){var dx=cs[i][0]-cx,dy=cs[i][1]-cy;maxr=Math.max(maxr,Math.sqrt(dx*dx+dy*dy));}
  var grd=ctx.createRadialGradient(cx,cy+6,0,cx,cy+6,maxr*1.05);
  grd.addColorStop(0,'rgba(30,41,59,.30)');
  grd.addColorStop(1,'rgba(30,41,59,0)');
  ctx.save();
  ctx.translate(cx,cy+8);ctx.scale(1,0.34);ctx.translate(-cx,-(cy+8));
  ctx.fillStyle=grd;
  ctx.beginPath();ctx.arc(cx,cy+8,maxr*1.05,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function render(){
  var w = canvas.clientWidth || window.innerWidth;
  var h = canvas.clientHeight || window.innerHeight;
  if(canvas.width!==w) canvas.width=w;
  if(canvas.height!==h) canvas.height=h;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // modelo ESTATICO (sem auto-rotacao) — arraste ainda permite explorar

  groundShadow();

  var drawList = [];
  for(var i=0;i<faces.length;i++){
    var f=faces[i];
    var projected=[], rotated=[];
    for(var j=0;j<f.verts.length;j++){
      var v=f.verts[j];
      projected.push(project(v[0], v[1], v[2]));
      rotated.push(rotatePoint(v[0], v[1], v[2]));
    }
    // SEM back-face culling: desenho dupla-face + ordenacao por profundidade.
    // (winding inconsistente entre caixas/cilindros fazia faces sumirem em certos angulos)
    var n=faceNormal(rotated);
    var len=Math.sqrt(n[0]*n[0]+n[1]*n[1]+n[2]*n[2])||1;
    var nn=[n[0]/len,n[1]/len,n[2]/len];
    var light=Math.abs(nn[0]*0.3+nn[1]*-0.7+nn[2]*-0.5);  // dupla-face: ilumina dos dois lados
    light=0.45+light*0.6;
    drawList.push({
      projected:projected, z:avgZ(projected),
      color: f.type==='case' ? caseColor : f.color,
      alpha: f.alpha, light: light
    });
  }
  drawList.sort(function(a,b){return b.z-a.z;});

  for(var i=0;i<drawList.length;i++){
    var dd=drawList[i], p=dd.projected;
    var r=Math.round(Math.min(255,dd.color[0]*dd.light));
    var g=Math.round(Math.min(255,dd.color[1]*dd.light));
    var b=Math.round(Math.min(255,dd.color[2]*dd.light));
    ctx.beginPath();
    ctx.moveTo(p[0][0],p[0][1]);
    for(var j=1;j<p.length;j++) ctx.lineTo(p[j][0],p[j][1]);
    ctx.closePath();
    ctx.fillStyle='rgba('+r+','+g+','+b+','+dd.alpha+')';
    ctx.fill();
    ctx.strokeStyle='rgba('+(r*0.4|0)+','+(g*0.4|0)+','+(b*0.4|0)+','+Math.max(0.12,dd.alpha*0.4)+')';
    ctx.lineWidth=0.6; ctx.stroke();
  }

  // textos: labels dos botoes + LCD
  ctx.textAlign='center';
  ctx.font='bold 10px Segoe UI,Arial';
  ctx.fillStyle='rgba(255,255,255,.95)';
  var bl=[['▼ CAT',63.5,54.5],['CAT ▲',91.5,54.5],
          ['◀ PAL',63.5,35],['PAL ▶',91.5,35],
          ['💬 FALAR',77.5,17.5]];
  for(var i=0;i<bl.length;i++){
    var lp=project(lx(bl[i][1]), -LID_F-6, lz(bl[i][2])+11);
    ctx.fillText(bl[i][0], lp[0], lp[1]);
  }
  var ang12=12*Math.PI/180;
  var zT=HINGE+14*Math.cos(ang12), yT=-LID_F-14*Math.sin(ang12);
  var zT2=HINGE+22*Math.cos(ang12), yT2=-LID_F-22*Math.sin(ang12);
  ctx.font='9px Consolas,monospace'; ctx.fillStyle='#5f5';
  var t1=project(0, yT-1.5, zT); ctx.fillText('Necessidades', t1[0], t1[1]);
  var t2=project(0, yT2-1.5, zT2); ctx.fillText('> Eu quero', t2[0], t2[1]);

  // selo no fundo
  if(rotX > -0.1){
    var seloC = project(lx(44), H_BASE+0.5, lz(86));
    ctx.font='bold 12px Segoe UI,Arial';
    ctx.fillStyle='rgba(255,255,255,0.42)';
    ctx.fillText('Voz Autista v3.0', seloC[0], seloC[1]);
  }

  requestAnimationFrame(render);
}

// ============ CONTROLES (opcionais) ============
canvas.addEventListener('mousedown',function(e){dragging=true;idle=0;lastMX=e.clientX;lastMY=e.clientY;});
canvas.addEventListener('mousemove',function(e){
  if(dragging){rotY+=(e.clientX-lastMX)*0.008;rotX+=(e.clientY-lastMY)*0.008;rotX=Math.max(-Math.PI/2,Math.min(Math.PI/2,rotX));idle=0;}
  lastMX=e.clientX;lastMY=e.clientY;
});
window.addEventListener('mouseup',function(){dragging=false;idle=0;});
canvas.addEventListener('wheel',function(e){e.preventDefault();zoom*=e.deltaY>0?0.93:1.07;zoom=Math.max(1,Math.min(7,zoom));},{passive:false});
canvas.addEventListener('touchstart',function(e){var t=e.touches[0];dragging=true;idle=0;lastMX=t.clientX;lastMY=t.clientY;},{passive:true});
canvas.addEventListener('touchmove',function(e){var t=e.touches[0];if(dragging){rotY+=(t.clientX-lastMX)*0.008;rotX+=(t.clientY-lastMY)*0.008;rotX=Math.max(-Math.PI/2,Math.min(Math.PI/2,rotX));idle=0;}lastMX=t.clientX;lastMY=t.clientY;},{passive:true});
canvas.addEventListener('touchend',function(){dragging=false;idle=0;});

buildModel();
render();
</script>
</body>
</html>
